name: scrapyard
description: A digital scrap paper workspace with built-in AI.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  pdfrx: ^1.0.60
  google_mlkit_text_recognition: ^0.16.0
  serious_python: ^4.5.1
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  uuid: ^4.4.0
  go_router: ^14.2.0
  path: ^1.9.0
  file_picker: ^10.3.10
  open_filex: ^4.7.0
  sqflite_common_ffi: ^2.4.0+2
  sqflite_common_ffi_web: ^1.1.1
  flutter_math_fork: ^0.7.3
  perfect_freehand: ^2.5.2+1
  flutter_colorpicker: ^1.1.0
  share_plus: ^10.1.4
  one_dollar_unistroke_recognizer: ^1.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true

flutter_native_splash:
  color: "#E8DCC8"
  image: assets/branding/app_icon_transparent.png
  android: true
  ios: true
  web: true
  android_12:
    color: "#E8DCC8"
    image: assets/branding/app_icon_android12.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - python/mathreader_app/main.py
    - PRIVACY.md
  fonts:
    - family: Courier Prime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
        - asset: assets/fonts/CourierPrime-Bold.ttf
          weight: 700
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
